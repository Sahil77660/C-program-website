```html
<!DOCTYPE html>
<html>
<head>
    <title>C Program Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* Code Box */
        .code-box {
            background: #182848;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .code-box h3 {
            margin-top: 0;
            color: #ffd166;
        }

        pre {
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Input + Output */
        .io-container {
            display: flex;
            gap: 20px;
        }

        .io-box {
            flex: 1;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        }

        .io-box h3 {
            margin-top: 0;
        }

        .input-box {
            border-left: 5px solid #4b6cb7;
        }

        .output-box {
            border-left: 5px solid #ffd166;
        }

        .input-area {
            width: 100%;
            height: 80px;
            box-sizing: border-box;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
        }

        .output {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 6px;
            min-height: 55px;
            box-sizing: border-box;
        }

        /* Phone */
        @media (max-width: 700px) {
            .io-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- CODE -->
    <div class="code-box">
        <h3>C Code</h3>

        <pre><code>#include &lt;stdio.h&gt;

void main()
{
    char ch;

    printf("Enter a character: ");
    scanf("%c", &amp;ch);

    printf("The character is: %c", ch);
}</code></pre>
    </div>


    <!-- INPUT + OUTPUT -->
    <div class="io-container">

        <!-- INPUT -->
        <div class="io-box input-box">
            <h3>Input</h3>

            <textarea class="input-area"
                placeholder="Enter your input here..."></textarea>
        </div>


        <!-- OUTPUT -->
        <div class="io-box output-box">
            <h3>Output</h3>

            <div class="output">
                Enter a character: A<br>
                The character is: A
            </div>
        </div>

    </div>

</div>

</body>
</html>
```
